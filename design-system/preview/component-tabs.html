<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabs — KHC Admin</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* Page scaffold — NOT extracted */
    body { margin: 0; padding: 12px; background: var(--color-bg-page); font-family: var(--font-body); color: var(--color-text-1); }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-text-2); text-transform: uppercase; }
    .divider { border: none; border-top: 1px solid var(--color-border); margin: 12px 0; }
    /* @component-css-start */
    /* Component definitions — extracted to components.css by deterministic script */
    .tabs { display: inline-flex; align-items: center; }
    .tab { border: none; background: transparent; color: var(--color-text-2); font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; min-width: 48px; transition: background .15s, color .15s, box-shadow .15s; }
    .tabs-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 4px; }
    .tabs-card .tab { padding: 6px 16px; border-radius: var(--radius-md); }
    .tabs-card .tab.active { background: var(--color-bg-card); color: var(--color-primary); box-shadow: var(--shadow-1); }
    .tabs-card .tab:hover:not(.active) { color: var(--color-text-1); background: var(--khc-surface-hover); }
    .tabs-pill { gap: 4px; }
    .tabs-pill .tab { padding: 4px 12px; font-size: 12px; border-radius: 10px; }
    .tabs-pill .tab.active { background: var(--khc-primary-50); color: var(--color-primary); }
    .tabs-pill .tab:hover:not(.active) { background: var(--khc-surface-hover); color: var(--color-text-1); }
    .tabs-line { border-bottom: 1px solid var(--color-border); }
    .tabs-line .tab { padding: 8px 16px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tabs-line .tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
    .tabs-line .tab:hover:not(.active) { color: var(--color-text-1); background: var(--khc-surface-hover); }
    /* @component-css-end */
  </style>
</head>
<body>
  <div class="row">
    <span class="label">卡片式</span>
    <div class="tabs tabs-card" data-evidence-sample="Card Tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true">概览</button>
      <button class="tab" role="tab" aria-selected="false">数据</button>
      <button class="tab" role="tab" aria-selected="false">设置</button>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">胶囊式</span>
    <div class="tabs tabs-pill" data-evidence-sample="Pill Tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true">全部</button>
      <button class="tab" role="tab" aria-selected="false">进行中</button>
      <button class="tab" role="tab" aria-selected="false">已完成</button>
    </div>
  </div>
  <div class="row">
    <span class="label">下划线</span>
    <div class="tabs tabs-line" data-evidence-sample="Line Tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true">基本信息</button>
      <button class="tab" role="tab" aria-selected="false">权限配置</button>
      <button class="tab" role="tab" aria-selected="false">操作日志</button>
    </div>
  </div>
</body>
</html>
