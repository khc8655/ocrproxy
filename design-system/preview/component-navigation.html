<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Navigation — KHC Admin</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-bg-page); font-family: var(--font-body); font-size: var(--type-body); line-height: var(--line-height-body); color: var(--color-text-1); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); }
.label { display: inline-block; width: 92px; font-size: var(--type-caption); color: var(--color-text-3); text-transform: uppercase; flex-shrink: 0; }
/* @component-css-start */
.top-nav { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 20px; background: var(--color-bg-card); border-bottom: 1px solid var(--color-border); box-shadow: var(--shadow-1); position: sticky; top: 0; z-index: 100; box-sizing: border-box; flex: 1; min-width: 0; }
.top-nav-brand { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
.top-nav-logo { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; background: linear-gradient(135deg, var(--color-primary), var(--khc-primary-700)); color: var(--khc-text-inverse); font-size: var(--font-size-h3); font-weight: var(--font-weight-h1); flex-shrink: 0; }
.top-nav-title { font-size: var(--font-size-h3); font-weight: var(--font-weight-h3); color: var(--color-text-1); white-space: nowrap; }
.top-nav-right { display: flex; align-items: center; gap: var(--space-4); flex-shrink: 0; }
.top-nav-info { font-size: var(--type-body); color: var(--color-text-2); white-space: nowrap; }
.top-nav-logout { display: inline-flex; align-items: center; height: var(--size-button-sm); min-width: var(--size-button-sm); padding: 0 var(--space-3); background: transparent; border: 1px solid var(--color-border); color: var(--color-text-2); font-size: var(--type-body); font-family: var(--font-body); cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
.top-nav-logout:hover { background: var(--khc-surface-hover); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row" data-evidence-sample="Default TopNav">
<span class="label">默认</span>
<header class="top-nav">
<div class="top-nav-brand">
<span class="top-nav-logo">K</span>
<span class="top-nav-title">KHC Admin</span>
</div>
<div class="top-nav-right">
<span class="top-nav-info">管理员</span>
<button class="top-nav-logout">退出登录</button>
</div>
</header>
</div>
</body>
</html>
