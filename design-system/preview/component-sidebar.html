<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Navigation — KHC Admin</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-bg-page); font-family: var(--font-body); color: var(--color-text-1); }
.row { display: flex; gap: var(--space-2); align-items: flex-start; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { display: inline-block; width: 92px; flex-shrink: 0; padding-top: 14px; font-size: var(--type-caption); color: var(--color-text-3); white-space: nowrap; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; }
/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.sidenav { width: 220px; background: var(--color-bg-card); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; flex-shrink: 0; box-sizing: border-box; }
.sidenav-menu { display: flex; flex-direction: column; padding: var(--space-1) 0; }
.sidenav-item { display: flex; align-items: center; gap: var(--space-2); padding: 10px 20px; font-size: 13px; line-height: 1.5; color: var(--color-text-2); text-decoration: none; white-space: nowrap; border-left: 2px solid transparent; box-sizing: border-box; cursor: pointer; transition: background .15s, color .15s; }
.sidenav-item:hover { background: var(--khc-surface-hover); color: var(--color-text-1); }
.sidenav-item.active { background: var(--khc-primary-50); color: var(--color-primary); border-left-color: var(--color-primary); }
.sidenav-item .nav-icon { display: inline-flex; align-items: center; flex-shrink: 0; }
.sidenav-item .nav-icon svg { width: var(--size-icon-sm); height: var(--size-icon-sm); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">默认</span><nav class="sidenav" data-evidence-sample="Default SideNav"><div class="sidenav-menu"><a class="sidenav-item active"><span class="nav-icon"><i data-lucide="layout-grid"></i></span><span>概览</span></a><a class="sidenav-item"><span class="nav-icon"><i data-lucide="settings"></i></span><span>基础配置</span></a><a class="sidenav-item"><span class="nav-icon"><i data-lucide="folder"></i></span><span>文档库</span></a><a class="sidenav-item"><span class="nav-icon"><i data-lucide="file-text"></i></span><span>模板管理</span></a><a class="sidenav-item"><span class="nav-icon"><i data-lucide="package"></i></span><span>入库</span></a><a class="sidenav-item"><span class="nav-icon"><i data-lucide="list"></i></span><span>任务中心</span></a><a class="sidenav-item"><span class="nav-icon"><i data-lucide="wrench"></i></span><span>维护工具</span></a></div></nav></div>
<hr class="divider">
<div class="row"><span class="label">切换激活</span><nav class="sidenav" data-evidence-sample="Default SideNav"><div class="sidenav-menu"><a class="sidenav-item"><span class="nav-icon"><i data-lucide="layout-grid"></i></span><span>概览</span></a><a class="sidenav-item"><span class="nav-icon"><i data-lucide="settings"></i></span><span>基础配置</span></a><a class="sidenav-item"><span class="nav-icon"><i data-lucide="folder"></i></span><span>文档库</span></a><a class="sidenav-item"><span class="nav-icon"><i data-lucide="file-text"></i></span><span>模板管理</span></a><a class="sidenav-item"><span class="nav-icon"><i data-lucide="package"></i></span><span>入库</span></a><a class="sidenav-item active"><span class="nav-icon"><i data-lucide="list"></i></span><span>任务中心</span></a><a class="sidenav-item"><span class="nav-icon"><i data-lucide="wrench"></i></span><span>维护工具</span></a></div></nav></div>
<script>lucide.createIcons();</script>
</body>
</html>
