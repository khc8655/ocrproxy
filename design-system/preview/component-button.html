<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button — KHC Admin</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: 12px; background: var(--color-bg-page); font-family: var(--font-body); color: var(--color-text-1); font-size: var(--font-size-body); }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-text-3); white-space: nowrap; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: 12px 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .btn { box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: var(--radius-sm); height: 32px; padding: 6px 16px; font-family: var(--font-body); font-size: 13px; line-height: 1; white-space: nowrap; cursor: pointer; min-width: 32px; flex-shrink: 0; transition: background .15s, border-color .15s, filter .15s; }
  .btn-primary { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
  .btn-primary:not(:disabled):hover { filter: brightness(1.08); }
  .btn-primary:not(:disabled):active { filter: brightness(.92); }
  .btn-secondary { background: #fff; color: var(--color-text-2); border-color: var(--color-border); }
  .btn-secondary:not(:disabled):hover { background: var(--color-bg-page); }
  .btn-secondary:not(:disabled):active { filter: brightness(.96); }
  .btn-danger { background: var(--color-danger); color: #fff; border-color: var(--color-danger); }
  .btn-danger:not(:disabled):hover { filter: brightness(1.08); }
  .btn-danger:not(:disabled):active { filter: brightness(.92); }
  .btn-small { height: 28px; padding: 4px 10px; font-size: 12px; min-width: 28px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row" data-evidence-sample="Primary Button"><span class="label">主要</span><button class="btn btn-primary" type="button">保存</button><button class="btn btn-primary" type="button" disabled>保存</button></div>
  <div class="row" data-evidence-sample="Secondary Button"><span class="label">次要</span><button class="btn btn-secondary" type="button">取消</button><button class="btn btn-secondary" type="button" disabled>取消</button></div>
  <div class="row" data-evidence-sample="Danger Button"><span class="label">危险</span><button class="btn btn-danger" type="button">删除</button><button class="btn btn-danger" type="button" disabled>删除</button></div>
  <hr class="divider">
  <div class="row" data-evidence-sample="Small Button"><span class="label">紧凑</span><button class="btn btn-primary btn-small" type="button">查看</button><button class="btn btn-secondary btn-small" type="button">编辑</button><button class="btn btn-danger btn-small" type="button">删除</button></div>
</body>
</html>
