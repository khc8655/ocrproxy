<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table · KHC Admin</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-bg-page); font-family: var(--font-body); color: var(--color-text-1); font-size: var(--type-body); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { display: inline-block; width: 92px; flex-shrink: 0; font-size: var(--type-caption); color: var(--color-text-3); text-transform: uppercase; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .tbl { width: 100%; border-collapse: collapse; background: var(--color-bg-card); font-size: 13px; }
  .tbl th { background: var(--color-bg-page); color: var(--color-text-2); font-size: 12px; font-weight: 500; text-align: left; padding: 10px 12px; white-space: nowrap; }
  .tbl td { padding: 10px 12px; color: var(--color-text-1); border-bottom: 1px solid var(--color-border); transition: background .15s; }
  .tbl tbody tr:last-child td { border-bottom: none; }
  .tbl tbody tr:hover td { background: var(--color-bg-page); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row"><span class="label">默认</span></div>
  <div class="row">
    <table class="tbl" data-evidence-sample="Default Table">
      <thead>
        <tr>
          <th>名称</th>
          <th>类型</th>
          <th>数量</th>
          <th>更新时间</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>项目一</td>
          <td>文档</td>
          <td>1,240</td>
          <td>2024-03-12</td>
        </tr>
        <tr>
          <td>项目二</td>
          <td>模板</td>
          <td>856</td>
          <td>2024-03-11</td>
        </tr>
        <tr>
          <td>项目三</td>
          <td>任务</td>
          <td>2,034</td>
          <td>2024-03-10</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
