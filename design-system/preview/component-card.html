<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card 预览 — KHC Admin</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-bg-page); font-family: var(--font-body); color: var(--color-text-1); }
.row { display: flex; margin-bottom: var(--space-2); }
.label { width: 92px; flex-shrink: 0; font-size: var(--type-caption); color: var(--color-text-3); font-weight: var(--font-weight-caption); }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 0; }
.divider + .row { margin-top: var(--space-4); }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th, .tbl td { text-align: left; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.tbl th { font-size: var(--type-caption); color: var(--color-text-3); font-weight: var(--font-weight-caption); }
.tbl td { font-size: var(--type-body); color: var(--color-text-2); }
.tbl tbody tr:last-child td { border-bottom: none; }

/* @component-css-start */
.card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 20px 24px; box-shadow: var(--shadow-1); margin-bottom: var(--space-4); }
.card-title { margin: 0 0 var(--space-3) 0; font-size: var(--font-size-h2); font-weight: var(--font-weight-h2); line-height: var(--line-height-h2); color: var(--color-text-1); }
.card-body { font-size: var(--type-body); line-height: var(--line-height-body); color: var(--color-text-2); }
.stat-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 16px 18px; box-shadow: var(--shadow-1); }
.stat-label { display: block; font-size: var(--type-caption); color: var(--color-text-3); font-weight: var(--font-weight-caption); margin-bottom: var(--space-2); }
.stat-value { display: block; font-size: 22px; font-weight: 700; color: var(--color-text-1); }
/* @component-css-end */
</style>
</head>
<body>
  <div class="row"><span class="label">标准卡片</span></div>
  <div class="card" data-evidence-sample="Standard Card">
    <h2 class="card-title">销售概览</h2>
    <div class="card-body">
      <table class="tbl">
        <thead><tr><th>订单编号</th><th>客户</th><th>金额</th></tr></thead>
        <tbody>
          <tr><td>#2024101</td><td>华北分部</td><td>¥12,480</td></tr>
          <tr><td>#2024102</td><td>华南分部</td><td>¥8,640</td></tr>
          <tr><td>#2024103</td><td>华东分部</td><td>¥15,200</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <hr class="divider">
  <div class="row"><span class="label">统计卡片</span></div>
  <div class="stat-grid">
    <div class="stat-card" data-evidence-sample="Stat Card">
      <span class="stat-label">本月营收</span>
      <span class="stat-value">¥248,560</span>
    </div>
    <div class="stat-card" data-evidence-sample="Stat Card">
      <span class="stat-label">活跃用户</span>
      <span class="stat-value">18,420</span>
    </div>
    <div class="stat-card" data-evidence-sample="Stat Card">
      <span class="stat-label">转化率</span>
      <span class="stat-value">32.8%</span>
    </div>
  </div>
</body>
</html>
