<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<title>Status Badge — KHC Admin</title>
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-bg-page); font-family: var(--font-body); color: var(--color-text-1); font-size: var(--type-body); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.row.tight { gap: 4px; }
.label { display: inline-block; width: 92px; flex-shrink: 0; font-size: var(--type-caption); color: var(--color-text-3); white-space: nowrap; }
.ctx { font-size: var(--type-body); color: var(--color-text-2); white-space: nowrap; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 8px 0; }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.badge { display: inline-flex; align-items: center; padding: 2px 10px; font-size: 12px; font-weight: 500; line-height: 1.5; border-radius: 10px; white-space: nowrap; flex-shrink: 0; min-width: 28px; }
.b-done { background: var(--khc-success-50); color: var(--color-success); }
.b-running { background: var(--khc-primary-50); color: var(--color-primary); }
.b-queued { background: var(--khc-neutral-100); color: var(--color-text-3); }
.b-failed { background: var(--khc-danger-50); color: var(--color-danger); }
.b-canceled { background: var(--khc-warning-50); color: var(--color-warning); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row">
  <span class="label">状态</span>
  <span class="badge b-done" data-evidence-sample="Done Badge">已完成</span>
  <span class="badge b-running" data-evidence-sample="Running Badge">运行中</span>
  <span class="badge b-queued" data-evidence-sample="Queued Badge">排队中</span>
  <span class="badge b-failed" data-evidence-sample="Failed Badge">失败</span>
  <span class="badge b-canceled" data-evidence-sample="Canceled Badge">已取消</span>
</div>
<hr class="divider">
<div class="row tight">
  <span class="label">内嵌</span>
  <span class="ctx">API 服务</span>
  <span class="badge b-running" data-evidence-sample="Running Badge">运行中</span>
</div>
</body>
</html>
