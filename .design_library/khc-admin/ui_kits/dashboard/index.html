<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="../../components.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <title>KHC Admin 设计系统</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--font-body);background:var(--color-bg-page);color:var(--color-text-1);font-size:var(--type-body);line-height:var(--line-height-body)}

    /* ── Layout skeleton (page-level only) ── */
    .uikit-shell{width:100%;max-width:1184px;margin:0 auto;overflow:hidden;display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;min-height:100vh}
    .uikit-shell>.top-nav{grid-column:1/-1}
    .uikit-sidebar,.uikit-main,.uikit-toolbar{min-width:0}
    .uikit-sidebar{overflow:hidden;max-width:100%}
    .uikit-main{padding:var(--space-4) var(--space-5);min-width:0}
    [data-component]{min-width:0;max-width:100%;overflow:hidden}
    .uikit-toolbar{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
    .uikit-responsive-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
    .uikit-table-wrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
    .uikit-truncate{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .uikit-nowrap{white-space:nowrap;flex-shrink:0}
    .uikit-action-cell{display:flex;align-items:center;gap:8px;min-width:0;max-width:160px;overflow:hidden}
    .uikit-action{min-width:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ── Page-level helpers ── */
    .page-title{font-size:var(--font-size-h1);font-weight:var(--font-weight-h1);line-height:var(--line-height-h1);color:var(--color-text-1);margin-bottom:var(--space-4);word-break:keep-all;overflow-wrap:break-word}
    .section-label{font-size:var(--font-size-h3);font-weight:var(--font-weight-h3);color:var(--color-text-1);margin-bottom:var(--space-3)}
    .stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3);margin-bottom:var(--space-5)}
    .tabular{font-variant-numeric:tabular-nums}
    .form-row{display:flex;align-items:flex-start;gap:var(--space-3);margin-bottom:var(--space-4)}
    .form-label{font-size:var(--type-body);color:var(--color-text-2);width:100px;flex-shrink:0;text-align:right;padding-top:9px}
    .form-input{flex:1;min-width:0;height:var(--size-input);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:0 var(--space-3);font-family:var(--font-body);font-size:var(--type-body);color:var(--color-text-1);background:var(--color-bg-card)}
    .form-input:focus{outline:2px solid var(--color-primary);outline-offset:-1px;border-color:var(--color-primary)}
    .swatch-row{display:flex;align-items:center;gap:var(--space-1);margin-bottom:var(--space-2)}
    .swatch{width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--color-border);flex-shrink:0}
    .swatch-name{font-size:var(--type-caption);color:var(--color-text-3);margin-left:var(--space-1);white-space:nowrap}
    .type-row{display:flex;align-items:baseline;gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--color-border)}
    .type-label{font-size:var(--type-caption);color:var(--color-text-3);width:72px;flex-shrink:0}
    .radius-box{width:48px;height:48px;background:var(--khc-primary-50);border:1px solid var(--color-border);display:inline-block;margin-right:var(--space-2);vertical-align:middle}
    .shadow-box{width:72px;height:36px;background:var(--color-bg-card);border:1px solid var(--color-border);display:inline-flex;align-items:center;justify-content:center;margin-right:var(--space-3);margin-bottom:var(--space-2);font-size:var(--type-caption);color:var(--color-text-3);vertical-align:middle}
    .space-bar{display:inline-block;background:var(--color-primary);margin-right:var(--space-1);vertical-align:bottom}

    /* ── Tabs ── */
    .tabs{display:inline-flex;align-items:center;gap:var(--space-1)}
    .tabs .tab{appearance:none;border:none;background:transparent;font-family:var(--font-body);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
    .tabs-card{background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:4px}
    .tabs-card .tab{padding:6px 16px;font-size:13px;line-height:1.5;color:var(--color-text-2);border-radius:var(--radius-sm)}
    .tabs-card .tab:hover{color:var(--color-text-1)}
    .tabs-card .tab.active{background:var(--color-bg-card);color:var(--color-primary);box-shadow:var(--shadow-1)}
    .tabs-pill .tab{padding:4px 12px;font-size:12px;line-height:1.5;color:var(--color-text-2);border-radius:10px}
    .tabs-pill .tab:hover{color:var(--color-text-1)}
    .tabs-pill .tab.active{background:var(--khc-primary-50);color:var(--color-primary)}
    .tabs-line{border-bottom:1px solid var(--color-border);gap:0}
    .tabs-line .tab{padding:8px 16px;font-size:13px;line-height:1.5;color:var(--color-text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
    .tabs-line .tab:hover{color:var(--color-text-1)}
    .tabs-line .tab.active{color:var(--color-primary);border-bottom-color:var(--color-primary)}

    /* ── Toolbar ── */
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:10px 14px;box-shadow:var(--shadow-1);margin-bottom:var(--space-4)}
    .toolbar-left,.toolbar-right{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;min-width:0}
    .toolbar-search{height:32px;min-width:180px;max-width:260px;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:0 var(--space-3);font-family:var(--font-body);font-size:13px;color:var(--color-text-1);background:var(--color-bg-card)}
    .toolbar-search:focus{outline:2px solid var(--color-primary);outline-offset:-1px;border-color:var(--color-primary)}
    .toolbar-search::placeholder{color:var(--color-text-3)}
    .btn-icon{padding:0;width:32px}

    /* ── Alert ── */
    .alert{display:flex;align-items:center;gap:var(--space-2);padding:10px 14px;border-radius:var(--radius-md);font-size:13px;line-height:1.5}
    .alert-icon{display:inline-flex;align-items:center;flex-shrink:0}
    .alert-text{flex:1;min-width:0}
    .alert.info{background:var(--khc-primary-50);border:1px solid var(--khc-primary-200);color:var(--color-text-2)}
    .alert.info .alert-icon{color:var(--color-primary)}
    .alert.success{background:var(--khc-success-50);border:1px solid var(--khc-success-200);color:var(--color-success)}
    .alert.success .alert-icon{color:var(--color-success)}
    .alert.warning{background:var(--khc-warning-50);border:1px solid var(--khc-warning-200);color:var(--color-warning)}
    .alert.warning .alert-icon{color:var(--color-warning)}
    .alert.error{background:var(--khc-danger-50);border:1px solid var(--khc-danger-200);color:var(--color-danger)}
    .alert.error .alert-icon{color:var(--color-danger)}

    /* ── Form Error ── */
    .form-field{display:flex;flex-direction:column;gap:var(--space-1)}
    .form-input-error{border-color:var(--color-danger)}
    .form-input-error:focus{outline-color:var(--color-danger);border-color:var(--color-danger);box-shadow:0 0 0 3px rgba(220,38,38,.12)}
    .error-msg{display:flex;align-items:center;gap:4px;font-size:12px;line-height:1.5;color:var(--color-danger);margin:0}

    /* ── Pagination ── */
    .pagination{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-2);margin-top:var(--space-4)}
    .pagination .btn{min-width:32px}
    .pagination .btn.active{background:var(--khc-primary-50);border-color:var(--color-primary);color:var(--color-primary)}

    /* ── Extra badges ── */
    .b-warning{background:var(--khc-warning-50);color:var(--color-warning)}
    .b-info{background:var(--khc-info-50);color:var(--color-info)}

    /* ── Icon system ── */
    .icon{width:var(--size-icon-md);height:var(--size-icon-md);display:inline-block;vertical-align:middle;color:currentColor}
    .icon-gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:var(--space-3)}
    .icon-item{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-3);background:var(--color-bg-page);border:1px solid var(--color-border);border-radius:var(--radius-md)}
    .icon-item .icon{width:24px;height:24px;color:var(--color-text-1)}
    .icon-caption{font-size:var(--type-caption);color:var(--color-text-3);white-space:nowrap}

    /* ── Modal ── */
    .modal-overlay{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(15,23,42,.45);z-index:200}
    .modal-dialog{width:520px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-5);display:flex;flex-direction:column}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--color-border)}
    .modal-header h3{font-size:var(--font-size-h3);font-weight:var(--font-weight-h3);margin:0}
    .modal-close{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--color-text-3);cursor:pointer;padding:4px;border-radius:var(--radius-sm)}
    .modal-close:hover{background:var(--khc-surface-hover)}
    .modal-close .icon{width:18px;height:18px}
    .modal-body{padding:16px 20px;overflow:auto}
    .modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--color-border)}

    /* ── File picker ── */
    .file-picker{display:flex;flex-direction:column;gap:var(--space-3)}
    .fp-breadcrumb{font-size:13px;color:var(--color-text-3)}
    .fp-list{border:1px solid var(--color-border);border-radius:var(--radius-md);max-height:320px;overflow:auto}
    .fp-row{display:flex;align-items:center;gap:var(--space-2);padding:8px 12px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--color-border)}
    .fp-row:last-child{border-bottom:none}
    .fp-row:hover{background:var(--khc-surface-hover)}
    .fp-row input[type=checkbox]{margin:0;cursor:pointer}
    .fp-row .icon{width:18px;height:18px;color:var(--color-warning);flex-shrink:0}
    .fp-name{color:var(--color-primary);font-size:var(--type-body)}
    .fp-meta{color:var(--color-text-3);font-size:var(--type-caption);margin-left:auto;white-space:nowrap}

    @media (max-width:900px){
      .uikit-shell{grid-template-columns:minmax(0,1fr)}
      .uikit-sidebar{display:none}
      .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .uikit-responsive-grid{grid-template-columns:minmax(0,1fr)}
    }
    @media (max-width:640px){
      .uikit-toolbar{flex-direction:column;align-items:stretch}
      .toolbar{flex-direction:column;align-items:stretch}
      .toolbar-left,.toolbar-right{width:100%}
      .toolbar-search{max-width:100%;flex:1}
      .stat-grid{grid-template-columns:minmax(0,1fr)}
      .uikit-responsive-grid{grid-template-columns:minmax(0,1fr)}
      .form-row{flex-direction:column}
      .form-label{width:auto;text-align:left;padding-top:0}
      .swatch-row{flex-wrap:wrap}
      .tabs-card{flex-wrap:wrap;width:100%}
      .tabs-card .tab{flex:1 1 auto}
    }
  </style>
</head>

      const filterTabs = ['全部','运行中','已停用'];

      const docs = [
        {model:'Doubao-pro-32k',modelId:'ep-20240115-xxxx-0001',guard:'已启用',time:'2024-01-15 14:32',status:'运行中'},
        {model:'Doubao-lite-4k',modelId:'ep-20240114-xxxx-0002',guard:'已启用',time:'2024-01-14 09:18',status:'即将下线'},
        {model:'GPT-4o',modelId:'ep-20240113-xxxx-0003',guard:'未启用',time:'2024-01-13 16:45',status:'运行中'},
        {model:'Claude-3-5-sonnet',modelId:'ep-20240112-xxxx-0004',guard:'已启用',time:'2024-01-12 11:20',status:'即将重新订阅'},
        {model:'Qwen-Max',modelId:'ep-20240111-xxxx-0005',guard:'已启用',time:'2024-01-11 08:05',status:'运行中'},
      ];

      return (
        <div>
          <h1 className="page-title">文档库</h1>

          <div className="tabs tabs-card" style={{marginBottom:'var(--space-4)'}} data-component="tabs">
            {primaryTabs.map(t => (
              <button key={t} className={'tab' + (primaryTab===t?' active':'')} onClick={()=>setPrimaryTab(t)}>{t}</button>
            ))}
          </div>

          <div className="tabs tabs-pill" style={{marginBottom:'var(--space-4)'}} data-component="tabs">
            {secondaryTabs.map(t => (
              <button key={t} className={'tab' + (secondaryTab===t?' active':'')} onClick={()=>setSecondaryTab(t)}>{t}</button>
            ))}
          </div>

          <div className="alert info" style={{marginBottom:'var(--space-4)'}} data-component="alert">
            <span className="alert-icon"><i data-lucide="info" style={{width:'16px',height:'16px'}}></i></span>
            <span className="alert-text">当前展示的是接入模型列表，操作前请确认权限。</span>
          </div>

          <div className="toolbar" data-component="toolbar">
            <div className="toolbar-left">
              <div className="tabs tabs-pill">
                {filterTabs.map(t => (
                  <button key={t} className={'tab' + (filterTab===t?' active':'')} onClick={()=>setFilterTab(t)}>{t}</button>
                ))}
              </div>
              <button className="btn btn-primary" data-component="button">新建</button>
            </div>
            <div className="toolbar-right">
              <input className="toolbar-search" type="text" placeholder="搜索域名/持有者" />
              <button className="btn btn-secondary btn-icon" data-component="button"><i data-lucide="refresh-cw" style={{width:'16px',height:'16px'}}></i></button>
            </div>
          </div>

          <div className="card" data-component="card" style={{padding:0,marginBottom:0}}>
            <div className="uikit-table-wrap">
              <table className="tbl" data-component="table">
                <thead>
                  <tr>
                    <th>接入模型</th>
                    <th>Model ID/接入点 ID</th>
                    <th>内容安全护栏</th>
                    <th>创建时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody>
                  {docs.map((d,i) => (
                    <tr key={i}>
                      <td className="uikit-truncate">{d.model}</td>
                      <td className="uikit-nowrap tabular">{d.modelId}</td>
                      <td className="uikit-nowrap">{d.guard}</td>
                      <td className="uikit-nowrap">{d.time}</td>
                      <td>
                        <div className="uikit-action-cell">
                          <span className={'badge '+modelStatusMap[d.status].cls} data-component="badge">{modelStatusMap[d.status].text}</span>
                          <button className="btn btn-secondary btn-small uikit-action" data-component="button">管理</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <div className="pagination">
            <button className="btn btn-secondary btn-small" disabled>上一页</button>
            <button className="btn btn-secondary btn-small active">1</button>
            <button className="btn btn-secondary btn-small">2</button>
            <button className="btn btn-secondary btn-small">3</button>
            <button className="btn btn-secondary btn-small">下一页</button>
          </div>
        </div>
      );
    }

    function TemplatesScreen() {
      useEffect(()=>{ initFilePicker('demoFilePicker'); }, []);
      const folders=['Excel','PPT','产品更新文档','方案文档','行业口袋书','品牌素材'];
      return (
        <div>
          <h1 className="page-title">模板管理</h1>
          <div className="card" data-component="card">
            <h2 className="card-title">模板来源</h2>
            <p style={{fontSize:'var(--type-body)',color:'var(--color-text-2)',marginBottom:'var(--space-4)'}}>从存储桶选择模板目录，系统将解析目录内的文档并生成模板。</p>
            <button className="btn btn-primary" data-component="button" onClick={()=>openModal('demoFilePicker')}>打开文件选择器</button>
          </div>

          <div className="modal-overlay" id="demoFilePicker">
            <div className="modal-dialog">
              <div className="modal-header">
                <h3>存储桶选择（选文件）</h3>
                <button className="modal-close" onClick={()=>closeModal('demoFilePicker')} aria-label="关闭">
                  <svg className="icon"><use href="#icon-close"/></svg>
                </button>
              </div>
              <div className="modal-body">
                <div className="file-picker">
                  <div className="fp-breadcrumb">小鱼易连 /</div>
                  <div className="fp-list">
                    {folders.map(name => (
                      <label key={name} className="fp-row">
                        <input type="checkbox" />
                        <svg className="icon"><use href="#icon-folder"/></svg>
                        <span className="fp-name">{name}</span>
                        <span className="fp-meta">（整个目录）</span>
                      </label>
                    ))}
                  </div>
                </div>
              </div>
              <div className="modal-footer">
                <button className="btn btn-secondary" onClick={()=>closeModal('demoFilePicker')}>取消</button>
                <button className="btn btn-primary" disabled>确定（已选 0 项）</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function PlaceholderScreen({title}) {
      return (
        <div>
          <h1 className="page-title">{title}</h1>
          <div className="card" data-component="card">
            <div className="card-body">该模块正在开发中，敬请期待。</div>
          </div>
        </div>
      );
    }

    function App() {
      const [active,setActive] = useState('overview');
      const renderView = () => {
        if(active==='overview') return <OverviewScreen/>;
        if(active==='tasks') return <TaskCenterScreen/>;
        if(active==='config') return <ConfigScreen/>;
        if(active==='docs') return <DocsLibraryScreen/>;
        if(active==='templates') return <TemplatesScreen/>;
        const item = navItems.find(i=>i.key===active);
        return <PlaceholderScreen title={item?item.label:''}/>;
      };
      return (
        <div className="uikit-shell" data-layout-guard="uikit-v1">
          <TopNav/>
          <Sidebar active={active} onSelect={setActive}/>
          <main className="uikit-main">
            {renderView()}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    setTimeout(function(){ if(window.lucide) lucide.createIcons(); }, 50);
  </script>
</body>
</html>
