<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert — KHC Admin</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { margin: 0; padding: var(--space-3); background: var(--color-bg-page); font-family: var(--font-body); color: var(--color-text-1); font-size: var(--font-size-body); line-height: var(--line-height-body); }
    .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
    .row.stack { align-items: flex-start; }
    .label { flex-shrink: 0; width: 92px; font-size: var(--font-size-caption); color: var(--color-text-3); }
    .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; }
    .rail { display: flex; gap: var(--space-2); align-items: center; flex: 1; min-width: 0; }
    .rail.stack { flex-direction: column; align-items: stretch; gap: var(--space-2); }
    /* @component-css-start */
    .alert { display: flex; align-items: flex-start; gap: var(--space-2); width: 100%; border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px; line-height: var(--line-height-body); box-sizing: border-box; }
    .alert.info { background: var(--khc-primary-50); border: 1px solid var(--khc-primary-200); color: var(--color-text-2); }
    .alert.success { background: var(--khc-success-50); border: 1px solid var(--khc-success-200); color: var(--khc-success-700); }
    .alert.warning { background: var(--khc-warning-50); border: 1px solid var(--khc-warning-200); color: var(--khc-warning-700); }
    .alert.error { background: var(--khc-danger-50); border: 1px solid var(--khc-danger-200); color: var(--khc-danger-700); }
    .alert .icon { flex-shrink: 0; width: var(--size-icon-sm); height: var(--size-icon-sm); margin-top: 1px; color: var(--color-primary); }
    .alert.success .icon { color: var(--color-success); }
    .alert.warning .icon { color: var(--color-warning); }
    .alert.error .icon { color: var(--color-danger); }
    .alert .message { flex: 1; min-width: 0; }
    .alert .close { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: var(--size-icon-md); height: var(--size-icon-md); margin: -2px -4px -2px 0; padding: 0; border: none; background: transparent; color: inherit; cursor: pointer; border-radius: var(--radius-sm); transition: background .15s; }
    .alert .close:hover { background: var(--khc-surface-hover); }
    .alert .close .icon { width: var(--size-icon-sm); height: var(--size-icon-sm); margin: 0; }
    /* @component-css-end */
  </style>
</head>
<body>
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-info" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></symbol>
    <symbol id="icon-success" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24"><path fill="currentColor" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></symbol>
    <symbol id="icon-error" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path fill="currentColor" d="M18.3 5.71L12 12l6.3 6.29-1.41 1.42L10.59 13.41l-6.3 6.3-1.41-1.42L9.17 12 2.88 5.71l1.41-1.42L10.59 10.6l6.3-6.3z"/></symbol>
  </svg>

  <div class="row"><span class="label">提示</span><div class="alert info" data-evidence-sample="Info Alert"><svg class="icon"><use href="#icon-info"/></svg><span class="message">后台数据将于每日凌晨 02:00 自动同步。</span></div></div>
  <div class="row"><span class="label">成功</span><div class="alert success" data-evidence-sample="Success Alert"><svg class="icon"><use href="#icon-success"/></svg><span class="message">客户信息保存成功。</span></div></div>
  <div class="row"><span class="label">警告</span><div class="alert warning" data-evidence-sample="Warning Alert"><svg class="icon"><use href="#icon-warning"/></svg><span class="message">当前网络不稳定，请稍后重试。</span></div></div>
  <div class="row"><span class="label">错误</span><div class="alert error" data-evidence-sample="Error Alert"><svg class="icon"><use href="#icon-error"/></svg><span class="message">提交失败，请检查必填项后重试。</span></div></div>

  <hr class="divider">

  <div class="row stack"><span class="label">可关闭</span><div class="rail stack">
    <div class="alert info" data-evidence-sample="Info Alert"><svg class="icon"><use href="#icon-info"/></svg><span class="message">后台数据将于每日凌晨 02:00 自动同步。</span><button class="close" aria-label="关闭"><svg class="icon"><use href="#icon-close"/></svg></button></div>
    <div class="alert success" data-evidence-sample="Success Alert"><svg class="icon"><use href="#icon-success"/></svg><span class="message">客户信息保存成功。</span><button class="close" aria-label="关闭"><svg class="icon"><use href="#icon-close"/></svg></button></div>
    <div class="alert warning" data-evidence-sample="Warning Alert"><svg class="icon"><use href="#icon-warning"/></svg><span class="message">当前网络不稳定，请稍后重试。</span><button class="close" aria-label="关闭"><svg class="icon"><use href="#icon-close"/></svg></button></div>
    <div class="alert error" data-evidence-sample="Error Alert"><svg class="icon"><use href="#icon-error"/></svg><span class="message">提交失败，请检查必填项后重试。</span><button class="close" aria-label="关闭"><svg class="icon"><use href="#icon-close"/></svg></button></div>
  </div></div>
</body>
</html>
