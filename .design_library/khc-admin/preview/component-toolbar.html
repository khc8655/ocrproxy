<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Toolbar - KHC Admin</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-bg-page); font-family: var(--font-body); color: var(--color-text-1); }
  .specimen { display: flex; flex-direction: column; gap: var(--space-4); }
  .stage { display: flex; flex-direction: column; gap: var(--space-3); }
  .story { display: grid; grid-template-columns: 92px 1fr; gap: var(--space-3); align-items: center; }
  .story-label { font-size: var(--font-size-caption); color: var(--color-text-2); text-transform: uppercase; letter-spacing: .02em; }
  .rail { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--space-3); padding: 10px 14px; background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-1); margin-bottom: 16px; }
  .toolbar-left { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .toolbar-right { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .toolbar-tab { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; font-size: var(--font-size-body); color: var(--color-text-2); background: transparent; border: 1px solid transparent; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; min-width: 32px; }
  .toolbar-tab:hover { background: var(--khc-surface-hover); }
  .toolbar-tab.active { color: var(--color-text-1); background: var(--color-bg-page); border-color: var(--color-border); }
  .toolbar-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; font-size: var(--font-size-body); color: var(--khc-text-inverse); background: var(--color-primary); border: 1px solid var(--color-primary); border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; min-width: 32px; }
  .toolbar-btn:hover { filter: brightness(1.08); }
  .toolbar-search { display: inline-flex; align-items: center; width: 200px; height: 32px; padding: 0 10px; font-size: var(--font-size-body); color: var(--color-text-1); background: var(--color-bg-page); border: 1px solid var(--color-border); border-radius: var(--radius-md); outline: none; }
  .toolbar-search::placeholder { color: var(--color-text-3); }
  .toolbar-icon { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; color: var(--color-text-2); background: transparent; border: 1px solid transparent; border-radius: var(--radius-md); cursor: pointer; transition: background .15s, border-color .15s; flex-shrink: 0; }
  .toolbar-icon:hover { background: var(--khc-surface-hover); }
  /* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <div class="stage">
    <div class="story">
      <span class="story-label">默认</span>
      <div class="rail">
        <div class="toolbar">
          <div class="toolbar-left">
            <button class="toolbar-tab active" type="button">全部</button>
            <button class="toolbar-tab" type="button">进行中</button>
            <button class="toolbar-tab" type="button">已完成</button>
            <button class="toolbar-btn" type="button">新建订单</button>
          </div>
          <div class="toolbar-right">
            <input class="toolbar-search" type="text" placeholder="搜索订单号 / 客户">
            <button class="toolbar-icon" type="button" aria-label="刷新">
              <img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/refresh-cw.svg" width="16" height="16" alt="">
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="story">
      <span class="story-label">简洁</span>
      <div class="rail">
        <div class="toolbar">
          <div class="toolbar-left">
            <button class="toolbar-btn" type="button">导出数据</button>
          </div>
          <div class="toolbar-right">
            <input class="toolbar-search" type="text" placeholder="搜索客户名称">
            <button class="toolbar-icon" type="button" aria-label="刷新">
              <img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/refresh-cw.svg" width="16" height="16" alt="">
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
